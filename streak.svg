<svg xmlns="http://www.w3.org/2000/svg" width="420" height="262" viewBox="0 0 420 262" xml:space="preserve">
<defs>
  <filter id="glow" x="-20%" y="-50%" width="140%" height="200%">
    <feGaussianBlur stdDeviation="2.2" result="b"/>
    <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
  <pattern id="scan" width="4" height="4" patternUnits="userSpaceOnUse">
    <rect width="4" height="1" fill="#ffffff" opacity="0.025"/>
  </pattern>
  <radialGradient id="vig" cx="50%" cy="45%" r="75%">
    <stop offset="60%" stop-color="#000" stop-opacity="0"/>
    <stop offset="100%" stop-color="#000" stop-opacity="0.45"/>
  </radialGradient>
  
</defs>
<style>
  text { font-family: 'JetBrains Mono','Fira Code','SF Mono',Menlo,Monaco,Consolas,'DejaVu Sans Mono','Liberation Mono','Courier New',monospace; white-space: pre; }
  .fade { animation-name: fade; animation-timing-function: ease-out; animation-fill-mode: backwards; }
  @keyframes fade { from { opacity: 0; transform: translateY(3px); } to { opacity: 1; transform: none; } }
  .blink { animation: blink 1.05s steps(1) infinite; }
  @keyframes blink { 50% { opacity: 0; } }
</style>
